services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnihogar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omnihogar"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./omnihogar-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=omnihogar;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:4200}
      # Scaffold migration (Identity + Product) not the real data model yet.
      # Flip to true once your own migrations exist and should auto-apply.
      ApplyMigrationsOnStartup: ${APPLY_MIGRATIONS_ON_STARTUP:-false}
      # Mercado Pago Checkout Pro (HU-08/HU-09) — optional: an empty token just makes checkout
      # calls fail with a "communication error" instead of stopping the whole API.
      MercadoPago__AccessToken: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MercadoPago__FrontendBaseUrl: ${FRONTEND_ORIGIN:-http://localhost:4200}
      MercadoPago__BackendPublicBaseUrl: ${MERCADOPAGO_BACKEND_PUBLIC_URL:-http://localhost:5244}
    ports:
      - "5244:8080"

  frontend:
    build:
      context: ./omnihogar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 4000
    ports:
      - "4200:4000"

volumes:
  db-data:
