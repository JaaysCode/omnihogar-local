services:
  backend:
    build:
      context: ./omnihogar-backend
    restart: unless-stopped
    # Podman's rootless network has no outbound IPv6 route — Neon's hostname resolves to both A
    # and AAAA records, and Npgsql picks the IPv6 one, which then fails with "Network is
    # unreachable" (the DOTNET_SYSTEM_NET_DISABLEIPV6 env var doesn't cover this code path).
    # Pin the hostname to its IPv4 address in /etc/hosts so DNS never offers IPv6 at all — keeps
    # SSL Mode=VerifyFull working since the connection string still uses the hostname. If Neon
    # rotates this IP and connections start failing again, re-resolve with
    # `getent ahostsv4 <host>` and update it here.
    extra_hosts:
      - "ep-wild-resonance-b4tvsggw.c-6.us-east-2.aws.neon.tech:77.112.100.143"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Neon (cloud Postgres) — no local db container. Set the direct (non-pooler) connection
      # string in .env; see Neon dashboard → Connection Details → toggle "Pooled connection" off.
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING:?set DATABASE_CONNECTION_STRING in .env (Neon connection string)}
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:4200}
      # Scaffold migration (Identity + Product) not the real data model yet.
      # Flip to true once your own migrations exist and should auto-apply.
      ApplyMigrationsOnStartup: ${APPLY_MIGRATIONS_ON_STARTUP:-false}
      # Stripe Checkout (HU-08/HU-09) — optional: an empty key just makes checkout calls fail
      # with a "communication error" instead of stopping the whole API.
      Stripe__SecretKey: ${SECRET_KEY:-}
      Stripe__FrontendBaseUrl: ${FRONTEND_ORIGIN:-http://localhost:4200}
      Stripe__BackendPublicBaseUrl: ${BACKEND_PUBLIC_URL:-http://localhost:5244}
      # Password recovery (HU-15) — real SMTP relay (Brevo). Required: the feature can't work
      # without it, so an unset value fails loudly at startup instead of silently no-op'ing.
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-smtp-relay.sendinblue.com}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__SmtpUsername: ${EMAIL_SMTP_USERNAME:?set EMAIL_SMTP_USERNAME in .env (tu cuenta Brevo)}
      Email__SmtpPassword: ${EMAIL_SMTP_PASSWORD:?set EMAIL_SMTP_PASSWORD in .env (SMTP key de Brevo, no la API key)}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-andresnose2016@gmail.com}
      Email__FrontendBaseUrl: ${FRONTEND_ORIGIN:-http://localhost:4200}
    ports:
      - "5244:8080"

  frontend:
    build:
      context: ./omnihogar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 4000
    ports:
      - "4200:4000"
